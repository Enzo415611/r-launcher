[package]
name = "r-launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
confy = "2.0.0"
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["tokio"] }
lighty-launcher = { version = "26.9.3", features = ["all-loaders", "events"] }
serde = { version = "1.0.229", features = ["derive"] }
toasty = { version = "0.11.0", features = ["sqlite"] }
